<div class="page-container">
  <div class="page-header">
    <div><h2><mat-icon>manage_accounts</mat-icon> Usuarios del Sistema</h2><p>Gestión de cuentas y roles</p></div>
    <button mat-raised-button color="primary" routerLink="/usuarios/nuevo"><mat-icon>person_add</mat-icon> Nuevo Usuario</button>
  </div>
  <mat-card class="table-card">
    <mat-card-content>
      <div class="table-toolbar">
        <mat-form-field appearance="outline" class="search-field"><mat-label>Buscar...</mat-label><input matInput (keyup)="applyFilter($event)"><mat-icon matSuffix>search</mat-icon></mat-form-field>
      </div>
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" matSort class="full-table">
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
            <td mat-cell *matCellDef="let u">
              <div class="user-cell">
                <div class="user-avatar" [class]="'rol-' + u.rol">{{ u.nombre.charAt(0) }}</div>
                <div><strong>{{ u.nombre }} {{ u.apellido }}</strong></div>
              </div>
            </td>
          </ng-container>
          <ng-container matColumnDef="correo"><th mat-header-cell *matHeaderCellDef>Correo</th><td mat-cell *matCellDef="let u">{{ u.correo }}</td></ng-container>
          <ng-container matColumnDef="rol">
            <th mat-header-cell *matHeaderCellDef>Rol</th>
            <td mat-cell *matCellDef="let u"><mat-chip [class]="'chip-rol-' + u.rol">{{ getRolLabel(u.rol) }}</mat-chip></td>
          </ng-container>
          <ng-container matColumnDef="especialidad"><th mat-header-cell *matHeaderCellDef class="hide-md">Especialidad</th><td mat-cell *matCellDef="let u" class="hide-md">{{ u.especialidad || '-' }}</td></ng-container>
          <ng-container matColumnDef="activo">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let u">
              <mat-chip [class]="u.activo ? 'chip-activo' : 'chip-inactivo'">{{ u.activo ? 'Activo' : 'Inactivo' }}</mat-chip>
            </td>
          </ng-container>
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let u">
              <button mat-icon-button (click)="editar(u)" matTooltip="Editar"><mat-icon>edit</mat-icon></button>
              <button mat-icon-button color="warn" (click)="eliminar(u)" matTooltip="Desactivar"><mat-icon>person_off</mat-icon></button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let r; columns: displayedColumns;"></tr>
        </table>
      </div>
      <mat-paginator [pageSizeOptions]="[10, 25]" showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
