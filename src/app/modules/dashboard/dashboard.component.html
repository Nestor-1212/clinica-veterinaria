<div class="page-container dashboard">
  <header class="page-header">
    <div>
      <h1>Hola, {{ nombre }}</h1>
      <p class="fecha">{{ datos.hoy | date: "EEEE, d 'de' MMMM 'de' yyyy" }}</p>
    </div>
    <div class="header-actions">
      @if (puedeClientes()) {
        <button mat-stroked-button class="vs-btn-urgent" type="button" (click)="nuevaAtencionInmediata()">
          <mat-icon>bolt</mat-icon> Atención inmediata
        </button>
      }
      @if (puedeCitas()) {
        <button mat-flat-button type="button" (click)="nuevaCita()"><mat-icon>event_available</mat-icon> Nueva cita</button>
      }
      @if (puedeClientes()) {
        <button mat-button type="button" (click)="nuevoCliente()"><mat-icon>person_add</mat-icon> Nuevo cliente</button>
      }
    </div>
  </header>

  <mat-tab-group class="vistas vs-tabs" [selectedIndex]="indice()" (selectedIndexChange)="cambiarVista($event)"
    mat-stretch-tabs="false" mat-align-tabs="start" animationDuration="0ms" aria-label="Vistas del dashboard">
    @for (v of vistas; track v) {
      <mat-tab [label]="etiquetas[v]">
        <ng-template matTabContent>
          @switch (v) {
            @case ('hoy') { <app-dashboard-hoy [datos]="datos" /> }
            @case ('negocio') { <app-dashboard-negocio [datos]="datos" /> }
            @case ('clientes') { <app-dashboard-clientes [datos]="datos" /> }
          }
        </ng-template>
      </mat-tab>
    }
  </mat-tab-group>
</div>
