<mat-toolbar class="app-header" color="primary">
  <button mat-icon-button (click)="menuToggle.emit()" class="menu-btn" aria-label="Abrir menú de navegación">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="brand">
    <mat-icon class="brand-icon">pets</mat-icon>
    <span class="brand-name">VetSystem</span>
  </div>

  <span class="spacer"></span>

  <div class="header-actions">
    <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-btn" [attr.aria-label]="'Menú de la cuenta de ' + (user?.nombre || '')">
      <div class="user-avatar">{{ user?.nombre?.charAt(0) }}</div>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before">
      <div class="user-menu-header" mat-menu-item disabled>
        <div class="user-info">
          <strong>{{ user?.nombre }} {{ user?.apellido }}</strong>
          <small>{{ rolLabel }}</small>
          <small class="correo">{{ user?.correo }}</small>
        </div>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        <span>Cerrar Sesión</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
