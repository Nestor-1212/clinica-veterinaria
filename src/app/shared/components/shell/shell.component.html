<div class="shell-layout">
  <a class="skip-link" href="#contenido" (click)="irAlContenido($event)">Saltar al contenido</a>

  <app-header [class.con-riel]="!isMobile" (menuToggle)="toggleSidenav()"></app-header>

  <mat-sidenav-container class="sidenav-container" [class.con-riel]="!isMobile">
    <mat-sidenav #sidenav
      [mode]="isMobile ? 'over' : 'side'"
      [opened]="!isMobile"
      class="app-sidenav">
      <app-sidebar (click)="isMobile && sidenav.close()"></app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <main id="contenido" class="content-wrapper" tabindex="-1" #contenido>
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
